<body class="bg-background text-on-background h-screen overflow-hidden flex flex-col relative">
<!-- Mock Background Content (Add Transaction Context) -->
<div class="flex-1 opacity-20 pointer-events-none p-md">
<h1 class="font-headline-lg text-headline-lg mb-lg">Add Transaction</h1>
<div class="h-64 bg-surface-container rounded-lg border border-surface-variant mb-md"></div>
<div class="h-32 bg-surface-container rounded-lg border border-surface-variant"></div>
</div>
<!-- Overlay Background -->
<div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-40" id="overlay-bg"></div>
<!-- Modal / Bottom Sheet -->
<div class="absolute bottom-0 w-full md:w-[480px] md:left-1/2 md:-translate-x-1/2 bg-surface-container border border-surface-variant rounded-t-xl md:rounded-xl md:bottom-auto md:top-1/2 md:-translate-y-1/2 z-50 shadow-[0_-4px_20px_0_rgba(0,0,0,0.5)] md:shadow-[0_8px_30px_0_rgba(0,0,0,0.5)] flex flex-col max-h-[85vh]">
<!-- Drag Handle (Mobile only) -->
<div class="w-full flex justify-center pt-md pb-sm md:hidden">
<div class="w-12 h-1 bg-surface-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-lg pt-sm md:pt-lg pb-md border-b border-surface-variant flex items-center justify-between sticky top-0 bg-surface-container rounded-t-xl z-10">
<h2 class="font-headline-md text-headline-md text-on-surface">Select an account</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Account List -->
<div class="flex-1 overflow-y-auto p-md space-y-xs">
<!-- BANK -->
<button class="w-full flex items-center justify-between p-md rounded-lg hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:text-tertiary transition-colors">
<span class="material-symbols-outlined">account_balance</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">BANK</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$1,250.00</span>
</button>
<!-- CARD -->
<button class="w-full flex items-center justify-between p-md rounded-lg hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:text-tertiary transition-colors">
<span class="material-symbols-outlined">credit_card</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">CARD</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$340.50</span>
</button>
<!-- CASH -->
<button class="w-full flex items-center justify-between p-md rounded-lg hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:text-tertiary transition-colors">
<span class="material-symbols-outlined">payments</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">CASH</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$85.00</span>
</button>
<!-- SAVINGS -->
<button class="w-full flex items-center justify-between p-md rounded-lg hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:text-tertiary transition-colors">
<span class="material-symbols-outlined">savings</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">SAVINGS</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$5,420.00</span>
